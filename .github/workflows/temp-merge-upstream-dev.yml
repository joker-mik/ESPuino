name: TEMP merge upstream dev

on:
  push:
    branches:
      - sync-upstream-dev-temp

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: improve-bluetooth-status
          fetch-depth: 0

      - name: Merge current upstream dev
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/biologist79/ESPuino.git || true
          git fetch upstream dev
          set +e
          git merge --no-ff upstream/dev -m "Merge upstream dev into improve-bluetooth-status"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            test "$(git diff --name-only --diff-filter=U)" = "html/management.html"
            perl -0pi -e 's/^<<<<<<< HEAD\n(.*?)^=======\n.*?^>>>>>>> upstream\/dev\n/$1/msg' html/management.html
            sed -i 's/<a href="#" class="link-secondary" data-bs-toggle="popover" data-i18n="\[data-bs-content\]bt.device.explanation" tabindex="0">/<a class="link-secondary" data-bs-toggle="popover" data-i18n="[data-bs-content]bt.device.explanation" tabindex="0">/' html/management.html
            sed -i 's/<a href="#" class="link-secondary" data-bs-toggle="popover" data-i18n="\[data-bs-content\]bt.pincode.explanation" tabindex="0">/<a class="link-secondary" data-bs-toggle="popover" data-i18n="[data-bs-content]bt.pincode.explanation" tabindex="0">/' html/management.html
            test "$(grep -c '^<<<<<<<\|^=======\|^>>>>>>>' html/management.html)" = "0"
            git add html/management.html
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check
          git commit --no-edit
          git push origin HEAD:improve-bluetooth-status
