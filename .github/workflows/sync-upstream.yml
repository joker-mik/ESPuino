name: Sync upstream

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Update dev and custom
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork dev branch
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync fork dev branch without upstream workflows
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/biologist79/ESPuino.git
          git fetch --no-tags upstream dev

          git restore \
            --source=upstream/dev \
            --staged \
            --worktree \
            -- . ':(exclude).github/workflows/**'

          if git diff --cached --quiet; then
            echo "dev ist bereits aktuell (Workflow-Dateien werden nicht synchronisiert)."
          else
            echo "Folgende Änderungen werden nach dev synchronisiert:"
            git diff --cached --stat
            git commit -m "Sync upstream dev (excluding GitHub workflows)"
            git push origin HEAD:dev
          fi

      - name: Merge dev into custom
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          before="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/branches/custom" \
              --jq '.commit.sha'
          )"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=custom \
            -f head=dev \
            -f commit_message="Merge upstream dev into custom"

          after="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/branches/custom" \
              --jq '.commit.sha'
          )"

          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "custom wurde aktualisiert."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen Änderungen vorhanden."
          fi

      - name: Start custom firmware build
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run firmware-builds.yml \
            --ref custom \
            --repo "${GITHUB_REPOSITORY}"
