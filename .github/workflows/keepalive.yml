name: Keep scheduled workflows alive

on:
  workflow_dispatch:
  schedule:
    # Twice a month, away from the top of the hour (UTC).
    - cron: "41 5 1,15 * *"

permissions:
  contents: write

concurrency:
  group: keepalive-master
  cancel-in-progress: false

jobs:
  keepalive:
    name: Refresh repository activity
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Create empty maintenance commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(ci): keep scheduled workflows active [skip ci]"
          git push origin HEAD:master
